name: Build EPG XML

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: epg-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate EPG
        run: |
          python3 scripts/merge_epg.py
          ls -lh epg.xml || true
          ls -lh guide.xml || true

      - name: Commit & push (robust)
        shell: bash
        run: |
          set -e

          # 必须有输出文件
          if [ ! -f epg.xml ]; then
            echo "epg.xml not found"
            exit 0
          fi

          # 如果 epg.xml 或 guide.xml 有变化才提交
          if ! git status --porcelain | grep -qE "epg.xml|guide.xml"; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 永远先对齐远端 main，避免 fetch-first
          git fetch origin main
          git reset --hard origin/main

          # reset 后文件会回到远端状态，所以再生成一次
          python3 scripts/merge_epg.py

          if ! git status --porcelain | grep -qE "epg.xml|guide.xml"; then
            echo "No changes after re-generate"
            exit 0
          fi

          git add epg.xml guide.xml
          git commit -m "Update epg.xml (filtered) and guide.xml" || true
          git push origin HEAD:main
